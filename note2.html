<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💭</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>大地記事</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    screens: { 'force-2col': '768px' }
                }
            }
        }
    </script>
    
    <style>
        :root {
            --earth-dark: #432818;
            --earth-primary: #99582a;
            --earth-bg: #f5ebe0;
        }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--earth-bg);
            color: var(--earth-dark);
            overflow-x: hidden;
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
        }
        .wood-texture {
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png');
        }
        .card-shadow {
            box-shadow: 0 4px 12px -2px rgba(67, 40, 24, 0.06);
        }
        .note-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        textarea, input { font-size: 16px !important; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
</head>
<body>

    <div id="app-root"></div>

    <script>
        // --- 1. Firebase 初始化設定 ---
        const firebaseConfig = {
            apiKey: "AIzaSyCWIB1JBSmMeW2UvTEX80UvRNPq4kkQyj0",
            authDomain: "note-fb03c.firebaseapp.com",
            projectId: "note-fb03c",
            storageBucket: "note-fb03c.firebasestorage.app",
            messagingSenderId: "834422503254",
            appId: "1:834422503254:web:5bb6bd988616c67f3a88f7"
        };
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(app);
        const auth = firebase.auth(app);
        const appId = 'earth-note-web-app';

        // --- 2. 全域狀態管理 ---
        let currentUser = null;
        let notesData = [];
        let selectedImageBase64 = null;
        let isUploading = false;

        // --- 3. 實用工具函式 ---
        const extractDateRange = (text) => {
            if (!text) return null;
            const exclusions = ["7-11", "711", "9-11", "101"];
            const monthPart = "(?:0?[1-9]|1[0-2])";
            const dayPart = "(?:3[01]|[12][0-9]|0?[1-9])"; 
            const separator = "[\\/\\-月]";
            const yearPart = "(?:\\d{4}[\\/\\-年])?";
            const connector = "[\\-\\~\\～\\—\\至\\到\\s]+";
            
            const fullRangeRegex = new RegExp(`(${yearPart}${monthPart}${separator}${dayPart}(?:日)?${connector}(?:(?:${monthPart}${separator})?${dayPart}(?![0-9])(?:日)?))`, "i");
            const singleDateRegex = new RegExp(`(?:^|[\\s])(${yearPart}${monthPart}${separator}${dayPart}(?![0-9])(?:日)?)`, "i");

            const rangeMatch = text.match(fullRangeRegex);
            if (rangeMatch && !exclusions.includes(rangeMatch[1].trim())) return rangeMatch[1];
            
            const singleMatch = text.match(singleDateRegex);
            if (singleMatch && !exclusions.includes(singleMatch[1].trim())) return singleMatch[1];
            
            return null;
        };

        const compressImage = (base64Str) => {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height ? width > 1024 : height > 1024) {
                        if (width > height) { height *= 1024 / width; width = 1024; }
                        else { width *= 1024 / height; height = 1024; }
                    }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
            });
        };

        const renderUrlLinks = (text) => {
            if (!text) return '';
            const urlRegex = /((?:https?:\/\/|www\.|[a-z0-9-]+\.[a-z]{2,})(?:[^\s()<>]+|\((?:[^\s()<>]+|(?:\([^\s()<>]+\)))?\))+(w+:\((?:[^\s()<>]+|(?:\([^\s()<>]+\)))?\)|[^\s`!()\[\]{};:'".,<>?«»指標“”指標‘’]))/gi;
            return text.replace(urlRegex, (url) => {
                const href = url.toLowerCase().startsWith('http') ? url : `https://${url}`;
                return `<a href="${href}" target="_blank" rel="noopener noreferrer" class="text-[#8b4513] hover:text-[#3d1f0a] underline decoration-[#8b4513]/40 font-bold break-all text-[14px] inline-block">${url}</a>`;
            });
        };

        // --- 4. 核心渲染引擎 (純 JS 控制 UI 抽換) ---
        const renderApp = () => {
            const root = document.getElementById('app-root');
            
            // 登入介面
            if (!currentUser) {
                root.innerHTML = `
                    <div class="min-h-screen flex flex-col items-center justify-center p-4 bg-[#f5ebe0]">
                        <div class="bg-white p-8 rounded-[32px] shadow-2xl text-center max-w-sm w-full border border-[#e3d5ca]">
                            <div class="w-16 h-16 bg-[#fdfaf6] rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-inner text-3xl">💭</div>
                            <h1 class="text-2xl font-black text-[#432818] mb-1">大地記事</h1>
                            <p class="text-[#99582a]/60 text-sm font-medium mb-8">個人專屬的靈感備忘錄</p>
                            <button id="login-btn" class="w-full flex items-center justify-center gap-3 py-3.5 px-6 bg-[#432818] text-white rounded-xl font-bold hover:bg-[#3d1f0a] active:scale-95 transition-all shadow-md text-sm">
                                🔑 使用 Google 帳號登入
                            </button>
                        </div>
                    </div>`;
                document.getElementById('login-btn').onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
                return;
            }

            // 主程式雙欄/單欄介面
            root.innerHTML = `
                <div class="flex flex-col md:flex-row min-h-screen">
                    <aside class="hidden md:flex w-48 wood-texture bg-[#432818] text-[#f5ebe0] flex-col p-4 fixed h-full shadow-2xl z-20">
                        <div class="mb-8"><h1 class="text-lg font-black flex items-center gap-2">📝 大地記事</h1></div>
                        <div class="flex-grow">
                            <div class="flex items-center gap-2.5 p-2 bg-white/10 rounded-lg text-[11px] font-bold">
                                📌 目前事件 <span class="ml-auto bg-[#bb9457] text-[#432818] px-1.5 py-0.5 rounded-full text-[9px]">${notesData.length}</span>
                            </div>
                        </div>
                        <div class="mt-auto space-y-2">
                            <div class="flex items-center gap-2 p-2 bg-white/5 rounded-lg">
                                <img src="${currentUser.photoURL || ''}" class="w-7 h-7 rounded border border-[#bb9457]/30">
                                <div class="flex-1 overflow-hidden">
                                    <div class="font-bold text-[10px] truncate">${currentUser.displayName || '使用者'}</div>
                                    <div class="text-[9px] opacity-40 font-bold">雲端同步中</div>
                                </div>
                            </div>
                            <button id="logout-btn-pc" class="w-full flex items-center justify-center gap-1.5 p-2 text-[10px] font-bold text-[#bb9457] hover:bg-white/5 rounded-lg transition-all">🚪 登出</button>
                        </div>
                    </aside>

                    <main class="flex-1 md:ml-48 bg-[#f5ebe0] pb-10">
                        <div class="bg-white/40 backdrop-blur-sm border-b border-[#e3d5ca] px-4 py-4 md:px-8 md:py-4 mb-4">
                            <header class="md:hidden flex items-center justify-between mb-4">
                                <h1 class="text-lg font-black text-[#432818]">📝 大地記事</h1>
                                <button id="logout-btn-mobile" class="p-1.5 text-[#99582a] bg-white/60 rounded-full text-xs">🚪 登出</button>
                            </header>
                            <div class="max-w-xl mx-auto">
                                <div class="bg-white rounded-[20px] card-shadow border border-[#e3d5ca] overflow-hidden px-2 py-1">
                                    <div id="image-preview-box" class="hidden p-2 bg-[#fdfaf6] border-b border-[#f5ebe0] relative flex justify-center rounded-t-[16px] mb-1">
                                        <img id="preview-img" class="max-h-40 rounded shadow-sm">
                                        <button id="clear-img-btn" class="absolute top-1 right-1 bg-black/40 text-white rounded-full w-5 h-5 text-xs">✕</button>
                                    </div>
                                    <div class="flex items-end gap-1">
                                        <button id="upload-trigger" class="p-2.5 text-[#99582a] hover:bg-[#99582a]/5 rounded-lg text-xl shrink-0">🖼️</button>
                                        <input type="file" id="file-input" class="hidden" accept="image/*">
                                        <textarea id="note-textarea" rows="1" placeholder="寫點什麼... (貼上圖片或輸入日期會自動偵測)" class="flex-1 bg-transparent border-none py-2.5 text-[16px] font-medium text-[#432818] focus:outline-none resize-none no-scrollbar h-10"></textarea>
                                        <button id="submit-note-btn" class="p-2.5 bg-[#432818] text-[#f5ebe0] rounded-lg shadow-md font-bold shrink-0 m-1 disabled:opacity-20">
                                            ${isUploading ? '⌛' : '發送'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="px-4 md:px-8 lg:px-10">
                            <div class="max-w-4xl mx-auto">
                                <div id="notes-container-mobile" class="flex flex-col gap-4 md:hidden"></div>
                                <div class="hidden md:flex gap-4 items-start">
                                    <div id="notes-container-left" class="flex-1 flex flex-col gap-4"></div>
                                    <div id="notes-container-right" class="flex-1 flex flex-col gap-4"></div>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>

                <div id="lightbox" class="hidden fixed inset-0 z-[100] bg-[#432818]/90 backdrop-blur-md flex items-center justify-center p-4">
                    <img id="lightbox-img" class="max-w-full max-h-[85vh] object-contain rounded shadow-2xl">
                </div>
            `;

            // 綁定事件監聽
            initEventListeners();
            // 渲染卡片清單
            renderCards();
        };

        // --- 5. 綁定按鈕與鍵盤事件 ---
        const initEventListeners = () => {
            const logoutPc = document.getElementById('logout-btn-pc');
            if (logoutPc) logoutPc.onclick = () => auth.signOut();
            const logoutMobile = document.getElementById('logout-btn-mobile');
            if (logoutMobile) logoutMobile.onclick = () => auth.signOut();

            const textarea = document.getElementById('note-textarea');
            const fileInput = document.getElementById('file-input');
            const uploadTrigger = document.getElementById('upload-trigger');
            const submitBtn = document.getElementById('submit-note-btn');
            const clearImgBtn = document.getElementById('clear-img-btn');

            // 自動高度
            textarea.oninput = () => {
                textarea.style.height = '40px';
                textarea.style.height = textarea.scrollHeight + 'px';
            };

            // 圖片選擇與壓縮
            uploadTrigger.onclick = () => fileInput.click();
            fileInput.onchange = (e) => handleImageFile(e.target.files[0]);
            textarea.onpaste = (e) => {
                const items = e.clipboardData.items;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf("image") !== -1) handleImageFile(items[i].getAsFile());
                }
            };

            clearImgBtn.onclick = () => {
                selectedImageBase64 = null;
                document.getElementById('image-preview-box').classList.add('hidden');
            };

            // 快捷發送
            textarea.onkeydown = (e) => {
                if (e.key === 'Enter' && !('ontouchstart' in window) && !e.shiftKey) {
                    e.preventDefault();
                    saveNote();
                }
            };
            submitBtn.onclick = saveNote;

            // 燈箱關閉
            document.getElementById('lightbox').onclick = () => {
                document.getElementById('lightbox').classList.add('hidden');
            };
        };

        const handleImageFile = (file) => {
            if (!file) return;
            const reader = new FileReader();
            reader.onloadend = async () => {
                selectedImageBase64 = await compressImage(reader.result);
                document.getElementById('preview-img').src = selectedImageBase64;
                document.getElementById('image-preview-box').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        };

        // --- 6. 寫入 Firebase 資料庫 ---
        const saveNote = async () => {
            const textarea = document.getElementById('note-textarea');
            const text = textarea.value.trim();
            if (!text && !selectedImageBase64) return;
            if (isUploading) return;

            isUploading = true;
            renderApp(); // 更新發送按鈕狀態

            const targetDate = extractDateRange(text);
            const finalContent = targetDate ? text.replace(targetDate, '').trim() : text;

            try {
                await db.collection('artifacts').doc(appId).collection('users').doc(currentUser.uid).collection('notes').add({
                    content: finalContent || "",
                    imageUrl: selectedImageBase64,
                    targetDate: targetDate,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                selectedImageBase64 = null;
            } catch (err) {
                console.error(err);
            } finally {
                isUploading = false;
                renderApp();
            }
        };

        // --- 7. 渲染備忘錄卡片清單 (完美對應卡片交錯背景) ---
        const renderCards = () => {
            const mobileContainer = document.getElementById('notes-container-mobile');
            const leftContainer = document.getElementById('notes-container-left');
            const rightContainer = document.getElementById('notes-container-right');

            mobileContainer.innerHTML = '';
            leftContainer.innerHTML = '';
            rightContainer.innerHTML = '';

            notesData.forEach((note, index) => {
                const rowGroup = Math.floor(index / 2);
                const isEvenGroup = rowGroup % 2 === 0;
                const bgClass = isEvenGroup ? 'bg-[#f7f9f2] border-[#e9efe0]' : 'bg-[#fffdf0] border-[#f5f5e6]';

                const cardHtml = `
                    <article class="note-card rounded-2xl p-4 card-shadow relative border animate-fade-in group ${bgClass}">
                        <button class="delete-card-btn absolute top-2 right-2 text-[#d5bdaf] hover:text-red-500 p-1 bg-white/80 rounded-full shadow-sm z-10 transition-colors" data-id="${note.id}">
                            🗑️
                        </button>
                        
                        ${note.targetDate ? `
                            <div class="flex items-center gap-1 text-[11px] font-black text-[#99582a] mb-2 bg-[#99582a]/10 w-fit px-2 py-0.5 rounded-full border border-[#99582a]/20">
                                📅 ${note.targetDate}
                            </div>
                        ` : ''}

                        ${note.imageUrl ? `
                            <div class="relative cursor-zoom-in overflow-hidden rounded-lg shadow-sm bg-black/5 mb-2 zoomable-img" data-src="${note.imageUrl}">
                                <img src="${note.imageUrl}" class="w-full h-auto max-h-[350px] object-cover">
                            </div>
                        ` : ''}

                        ${note.content ? `
                            <div class="card-content-text text-[#432818] text-[16px] font-medium leading-relaxed whitespace-pre-wrap break-words hover:bg-[#99582a]/5 p-1 rounded transition-colors" data-id="${note.id}">
                                ${renderUrlLinks(note.content)}
                            </div>
                        ` : ''}
                    </article>
                `;

                // 手機板全放
                mobileContainer.insertAdjacentHTML('beforeend', cardHtml);
                // 電腦版左右交錯放置
                if (index % 2 === 0) {
                    leftContainer.insertAdjacentHTML('beforeend', cardHtml);
                } else {
                    rightContainer.insertAdjacentHTML('beforeend', cardHtml);
                }
            });

            // 綁定卡片內動態元素的點擊事件
            document.querySelectorAll('.delete-card-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const id = btn.getAttribute('data-id');
                    db.collection('artifacts').doc(appId).collection('users').doc(currentUser.uid).collection('notes').doc(id).delete();
                };
            });

            document.querySelectorAll('.zoomable-img').forEach(div => {
                div.onclick = () => {
                    document.getElementById('lightbox-img').src = div.getAttribute('data-src');
                    document.getElementById('lightbox').classList.remove('hidden');
                };
            });

            // 行內點擊直接編輯功能
            document.querySelectorAll('.card-content-text').forEach(div => {
                div.onclick = function(e) {
                    if (e.target.tagName === 'A') return;
                    const id = div.getAttribute('data-id');
                    const currentNote = notesData.find(n => n.id === id);
                    const fullText = `${currentNote.targetDate || ''} ${currentNote.content || ''}`.trim();

                    const textarea = document.createElement('textarea');
                    textarea.value = fullText;
                    textarea.className = "w-full bg-white border border-[#99582a]/30 p-2 text-[16px] font-medium text-[#432818] focus:outline-none resize-none rounded shadow-inner";
                    
                    div.replaceWith(textarea);
                    textarea.focus();
                    textarea.style.height = textarea.scrollHeight + 'px';

                    textarea.onblur = async () => {
                        const val = textarea.value.trim();
                        if (val === fullText || (!val && !currentNote.imageUrl)) {
                            renderCards();
                            return;
                        }
                        const newDate = extractDateRange(val);
                        const newContent = newDate ? val.replace(newDate, '').trim() : val;

                        await db.collection('artifacts').doc(appId).collection('users').doc(currentUser.uid).collection('notes').doc(id).update({
                            content: newContent || "",
                            targetDate: newDate || null
                        });
                    };
                };
            });
        };

        // --- 8. 智慧自動排序邏輯 ---
        const sortNotesSmartly = (data) => {
            const sortedByCreated = [...data].sort((a, b) => {
                const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : Date.now();
                const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : Date.now();
                return timeB - timeA;
            });
            const result = [];
            const handledIds = new Set();
            sortedByCreated.forEach(note => {
                if (handledIds.has(note.id)) return;
                if (note.targetDate) {
                    const targetIdx = result.findIndex(r => r.targetDate === note.targetDate);
                    if (targetIdx !== -1) result.splice(targetIdx + 1, 0, note);
                    else result.push(note);
                } else {
                    result.push(note);
                }
                handledIds.add(note.id);
            });
            return result;
        };

        // --- 9. 監聽 Firebase 登入與資料即時更新狀態 ---
        auth.onAuthStateChanged((user) => {
            currentUser = user;
            renderApp();

            if (user) {
                // 即時接上資料庫監聽
                db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('notes')
                  .onSnapshot((snapshot) => {
                      const rawNotes = [];
                      snapshot.forEach(doc => rawNotes.push({ id: doc.id, ...doc.data() }));
                      notesData = sortNotesSmartly(rawNotes);
                      renderCards();
                      // 同步更新側邊欄數字
                      const pcCount = document.querySelector('aside span');
                      if (pcCount) pcCount.innerText = notesData.length;
                  });
            }
        });
    </script>
</body>
</html>
