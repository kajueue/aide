<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💭</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>大地記事</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    screens: {
                        'force-2col': '768px',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        :root {
            --earth-dark: #432818;
            --earth-primary: #99582a;
            --earth-bg: #f5ebe0;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--earth-bg);
            color: var(--earth-dark);
            overflow-x: hidden;
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
        }

        .wood-texture {
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png');
        }

        .card-shadow {
            box-shadow: 0 4px 12px -2px rgba(67, 40, 24, 0.06);
        }

        .note-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        textarea, input {
            font-size: 16px !important;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyCWIB1JBSmMeW2UvTEX80UvRNPq4kkQyj0",
            authDomain: "note-fb03c.firebaseapp.com",
            projectId: "note-fb03c",
            storageBucket: "note-fb03c.firebasestorage.app",
            messagingSenderId: "834422503254",
            appId: "1:834422503254:web:5bb6bd988616c67f3a88f7"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(app);
        const auth = firebase.auth(app);

        window.FirebaseSDK = {
            app, db, auth,
            collection: (db, ...paths) => db.collection(paths.join('/')),
            addDoc: (ref, data) => ref.add(data),
            onSnapshot: (queryRef, callback, errCallback) => {
                return queryRef.onSnapshot(
                    snapshot => {
                        snapshot.docs.map = (fn) => snapshot.docs.map(doc => fn({ id: doc.id, data: () => doc.data() }));
                        callback(snapshot);
                    },
                    errCallback
                );
            },
            doc: (db, ...paths) => db.doc(paths.join('/')),
            deleteDoc: (docRef) => docRef.delete(),
            updateDoc: (docRef, data) => docRef.update(data),
            query: (ref) => ref,
            serverTimestamp: () => firebase.firestore.FieldValue.serverTimestamp(),
            GoogleAuthProvider: firebase.auth.GoogleAuthProvider,
            signInWithPopup: (auth, provider) => auth.signInWithPopup(provider),
            signOut: (auth) => auth.signOut(),
            onAuthStateChanged: (auth, callback) => auth.onAuthStateChanged(callback),
            signInWithCustomToken: (auth, token) => auth.signInWithCustomToken(token),
            signInAnonymously: (auth) => auth.signInAnonymously()
        };
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" src="app.js"></script>
</body>
</html>
