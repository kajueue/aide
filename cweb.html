<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>網址追蹤碼清理器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; 
        }
        .main-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 360px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }
        button:active {
            transform: scale(0.97);
        }
        .container-box {
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
        }
        /* 極致縮小輸入框字體與行高，提升視覺平衡 */
        textarea {
            font-size: 0.7rem !important;
            line-height: 1.35;
        }
    </style>
</head>
<body class="container-box">

    <div class="main-card p-5 space-y-3.5">
        <div class="text-center">
            <h1 class="text-base font-black text-slate-800 tracking-tight">網址追蹤碼清理器</h1>
            <p class="text-[9px] text-slate-400 mt-0.5">自動移除網址追蹤參數</p>
        </div>

        <div class="space-y-3 flex flex-col flex-grow">
            <!-- 輸入區域：再次縮減內距與最小高度 -->
            <textarea 
                id="urlInput" 
                class="w-full flex-grow min-h-[90px] p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:border-blue-500 focus:bg-white outline-none transition-all break-all font-mono placeholder:text-slate-300 resize-none shadow-inner"
                placeholder="在此貼上網址..."
            ></textarea>

            <div class="flex flex-col gap-2">
                <!-- 1. 貼上按鈕：調整高度為 py-2.5 -->
                <button 
                    id="pasteBtn"
                    class="w-full flex items-center justify-center gap-2 bg-slate-800 text-white py-2.5 rounded-xl hover:bg-black transition-all font-bold text-xs shadow-md"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
                    貼上並清理
                </button>

                <!-- 2. 複製按鈕：調整高度為 py-2.5 -->
                <button 
                    id="copyBtn"
                    class="w-full flex items-center justify-center gap-2 bg-emerald-500 text-white py-2.5 rounded-xl hover:bg-emerald-600 transition-all font-bold text-xs shadow-lg shadow-emerald-50"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    複製結果
                </button>
            </div>
        </div>

        <div class="text-center pt-0.5">
            <p class="text-[8px] text-slate-400 leading-tight">
                本工具會切除問號 (?) 之後的所有內容
            </p>
        </div>
    </div>

    <!-- Toast 訊息 -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur-sm text-white px-4 py-1.5 rounded-full text-[9px] shadow-2xl opacity-0 transition-all duration-300 pointer-events-none z-50"></div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const pasteBtn = document.getElementById('pasteBtn');
        const copyBtn = document.getElementById('copyBtn');
        const toast = document.getElementById('toast');

        function showToast(msg) {
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', '-translate-y-2');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
                toast.classList.remove('opacity-100', '-translate-y-2');
            }, 1800);
        }

        function performClean() {
            let val = urlInput.value.trim();
            if (!val) return;
            const qIndex = val.indexOf('?');
            if (qIndex !== -1) {
                urlInput.value = val.substring(0, qIndex);
                return true;
            }
            return false;
        }

        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    urlInput.value = text;
                    const wasCleaned = performClean();
                    showToast(wasCleaned ? '已清理完成' : '已貼上');
                }
            } catch (err) {
                urlInput.focus();
                showToast('請直接在此貼上網址');
            }
        });

        urlInput.addEventListener('input', () => {
            performClean();
        });

        copyBtn.addEventListener('click', () => {
            if (!urlInput.value) {
                showToast('尚未輸入內容');
                return;
            }
            urlInput.select();
            urlInput.setSelectionRange(0, 99999);
            try {
                const successful = document.execCommand('copy');
                if (successful) showToast('已複製成功');
            } catch (err) {
                showToast('複製失敗');
            }
        });
    </script>
</body>
</html>
