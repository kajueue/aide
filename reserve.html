<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會談預約管理系統 - Cloud Sync</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        /* 載入動畫 */
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #78350f; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="app" class="min-h-screen p-2 md:p-6">
        <div class="max-w-6xl mx-auto">
            <!-- Header -->
            <header class="mb-3 flex items-center justify-between">
                <h1 class="text-lg md:text-xl font-bold text-slate-900 flex items-center gap-2">
                    <i data-lucide="calendar" class="text-amber-800 w-5 h-5"></i>
                    會談預約一覽表 (Cloud Sync)
                </h1>
                <div id="status-indicator" class="flex items-center gap-2 text-[10px] font-medium text-slate-400">
                    <span id="status-dot" class="w-2 h-2 rounded-full bg-slate-300 transition-colors"></span>
                    <span id="status-text">連線中...</span>
                </div>
            </header>

            <!-- Table Card -->
            <div class="bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden relative">
                <!-- Loading Overlay -->
                <div id="loading-overlay" class="absolute inset-0 bg-white/90 z-10 flex items-center justify-center transition-opacity duration-300">
                    <div class="flex flex-col items-center gap-2">
                        <div class="loader"></div>
                        <span class="text-xs text-amber-900 font-medium">同步雲端資料...</span>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full border-collapse table-fixed min-w-[600px]">
                        <thead>
                            <tr class="bg-slate-100">
                                <th class="p-1.5 border-b border-r text-[10px] md:text-xs font-semibold text-slate-500 w-16 md:w-24">時段</th>
                                <th class="p-1.5 border-b text-xs md:text-sm font-bold text-slate-700">週一</th>
                                <th class="p-1.5 border-b text-xs md:text-sm font-bold text-slate-700">週二</th>
                                <th class="p-1.5 border-b text-xs md:text-sm font-bold text-slate-700">週三</th>
                                <th class="p-1.5 border-b text-xs md:text-sm font-bold text-slate-700">週四</th>
                                <th class="p-1.5 border-b text-xs md:text-sm font-bold text-slate-700">週五</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <!-- 由 JS 生成 -->
                        </tbody>
                    </table>
                </div>
            </div>
            <p class="mt-3 text-center text-[10px] text-slate-400 md:hidden">提示：左右滑動查看完整週曆表格</p>
        </div>

        <!-- Modal -->
        <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in duration-200">
                <div class="p-4 border-b flex justify-between items-center bg-[#EFEBE9]">
                    <h3 id="modal-title" class="font-bold text-base text-amber-900 flex items-center gap-2"></h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1">
                        <i data-lucide="x-circle"></i>
                    </button>
                </div>
                
                <div class="p-5 space-y-5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wider">備註內容</label>
                        <input id="note-input" type="text" class="w-full px-3 py-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-amber-800 focus:border-amber-800 outline-none transition-all text-sm" placeholder="請輸入備註...">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="updateStatus('booked')" class="flex flex-col items-center justify-center gap-2 p-3 rounded-lg border border-amber-100 bg-[#F5F5F5] text-amber-900 text-xs font-bold hover:border-amber-800 transition-colors">
                            <span class="text-xl">✨</span> 標記已約
                        </button>
                        <button onclick="updateStatus('busy')" class="flex flex-col items-center justify-center gap-2 p-3 rounded-lg border border-rose-100 bg-rose-50 text-rose-700 text-xs font-bold hover:border-rose-500 transition-colors">
                            <i data-lucide="x-circle" class="w-5 h-5"></i> 不開放
                        </button>
                        <button onclick="updateStatus('pending')" class="flex flex-col items-center justify-center gap-2 p-3 rounded-lg border border-amber-500/20 bg-amber-50 text-amber-700 text-xs font-bold hover:border-amber-500 transition-colors">
                            <i data-lucide="minus-circle" class="w-5 h-5"></i> 暫定
                        </button>
                        <button onclick="updateStatus('empty')" class="flex flex-col items-center justify-center gap-2 p-3 rounded-lg border border-slate-100 bg-white text-slate-500 text-xs font-bold hover:border-slate-400 transition-colors">
                            <i data-lucide="trash-2" class="w-5 h-5"></i> 清除/開放
                        </button>
                    </div>
                </div>

                <div class="p-3 bg-slate-50 flex gap-2">
                    <button onclick="closeModal()" class="flex-1 py-2 text-sm rounded-lg bg-slate-200 text-slate-700 font-bold">取消</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase 設定與環境變數
        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 資料狀態
        let appointments = {};
        let lastUsedAnimalIndex = -1;
        let selectedCellId = null;
        let currentUser = null;

        const animals = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🐦', '🐤', '🦆', '🦅', '🦉', '🦇', '🐺'];
        const days = ['週一', '週二', '週三', '週四', '週五'];
        const timeSlots = [
            { id: 'morning', label: '早休', time: '07:55-08:35' },
            { id: '1', label: '1', time: '08:40-09:20' },
            { id: '2', label: '2', time: '09:30-10:10' },
            { id: '3', label: '3', time: '10:30-11:10' },
            { id: '4', label: '4', time: '11:20-12:00' },
            { id: 'noon', label: '午休', time: '12:40-13:20' },
            { id: '5', label: '5', time: '13:30-14:10' },
            { id: '6', label: '6', time: '14:20-15:00' },
            { id: '7', label: '7', time: '15:10-15:50' },
        ];

        // 取得主要文件的 Reference
        const getMainDocRef = () => doc(db, 'artifacts', appId, 'public', 'data', 'app_config', 'appointments_main');

        // 登入邏輯（含重試機制）
        async function startSystem() {
            let retries = 5;
            let delay = 1000;

            const attemptSignIn = async () => {
                try {
                    if (initialAuthToken) {
                        await signInWithCustomToken(auth, initialAuthToken);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (err) {
                    if (retries > 0) {
                        retries--;
                        setTimeout(attemptSignIn, delay);
                        delay *= 2; // 指數退避
                    } else {
                        console.error("Auth Final Failure:", err);
                        document.getElementById('status-text').innerText = "連線失敗";
                    }
                }
            };
            attemptSignIn();
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-green-500";
                document.getElementById('status-text').innerText = "雲端同步中";
                setupRealtimeListeners();
            }
        });

        // 監聽雲端資料更新
        function setupRealtimeListeners() {
            if (!currentUser) return;
            const appRef = getMainDocRef();
            onSnapshot(appRef, (docSnap) => {
                if (docSnap.exists()) {
                    appointments = docSnap.data().data || {};
                    lastUsedAnimalIndex = docSnap.data().lastIndex || -1;
                }
                renderTable();
                // 隱藏載入畫面
                const overlay = document.getElementById('loading-overlay');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }, (error) => {
                console.error("Firestore Sync Error:", error);
            });
        }

        function isLockedSlot(day, slotId) {
            return day === '週三' && ['noon', '5', '6', '7'].includes(slotId);
        }

        window.renderTable = function() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            timeSlots.forEach(slot => {
                const tr = document.createElement('tr');
                if (['noon', 'morning'].includes(slot.id)) tr.className = 'bg-slate-50/50';

                let tdHtml = `
                    <td class="p-1 border-b border-r text-center align-middle bg-slate-50/30">
                        <div class="font-bold text-amber-900 text-[10px] md:text-xs leading-tight">${slot.label}</div>
                        <div class="text-[8px] text-slate-400 leading-tight font-mono">${slot.time}</div>
                    </td>
                `;

                days.forEach(day => {
                    const cellId = `${day}-${slot.id}`;
                    const locked = isLockedSlot(day, slot.id);
                    const data = appointments[cellId];
                    
                    let content = '';
                    let bgColor = 'bg-white';
                    let textColor = 'text-slate-300';
                    let text = '可預約';

                    if (locked) {
                        bgColor = 'bg-slate-50';
                        content = '<i data-lucide="lock" class="w-3 h-3 text-slate-200"></i>';
                        text = '';
                    } else if (data) {
                        switch (data.status) {
                            case 'booked':
                                const icon = data.animalIndex !== undefined ? animals[data.animalIndex] : '👤';
                                bgColor = 'bg-[#EFEBE9]';
                                textColor = 'text-amber-900 font-medium';
                                text = data.note || '已預約';
                                content = `<span class="text-base">${icon}</span>`;
                                break;
                            case 'busy':
                                bgColor = 'bg-rose-50';
                                textColor = 'text-rose-700 font-medium';
                                text = data.note || '';
                                content = '<i data-lucide="x-circle" class="w-3.5 h-3.5 text-rose-400"></i>';
                                break;
                            case 'pending':
                                bgColor = 'bg-amber-50';
                                textColor = 'text-amber-700 font-medium';
                                text = data.note || '暫定';
                                content = '<i data-lucide="minus-circle" class="w-3.5 h-3.5 text-amber-500"></i>';
                                break;
                        }
                    }

                    tdHtml += `
                        <td onclick="handleCellClick('${day}', '${slot.id}')" 
                            class="p-0.5 border-b border-r last:border-r-0 transition-all relative h-12 md:h-20 ${locked ? 'cursor-not-allowed' : 'cursor-pointer hover:bg-slate-100/50'} ${bgColor}">
                            <div class="flex flex-col items-center justify-center h-full gap-0 px-0.5 leading-tight">
                                ${content}
                                <span class="text-[10px] md:text-[11px] text-center line-clamp-2 leading-tight ${textColor}">${text}</span>
                            </div>
                        </td>
                    `;
                });

                tr.innerHTML = tdHtml;
                tbody.appendChild(tr);
            });
            lucide.createIcons();
        }

        window.handleCellClick = function(day, slotId) {
            if (isLockedSlot(day, slotId)) return;
            selectedCellId = `${day}-${slotId}`;
            const data = appointments[selectedCellId];
            
            document.getElementById('modal-title').innerHTML = `<i data-lucide="clock" class="w-5 h-5"></i> ${day} 第 ${slotId === 'morning' ? '早休' : slotId === 'noon' ? '午休' : slotId} 節`;
            document.getElementById('note-input').value = data?.note || '';
            document.getElementById('modal').style.display = 'flex';
            lucide.createIcons();
        }

        window.closeModal = function() {
            document.getElementById('modal').style.display = 'none';
            selectedCellId = null;
        }

        window.updateStatus = async function(status) {
            if (!selectedCellId || !currentUser) return;
            const note = document.getElementById('note-input').value;
            
            let newAppointments = { ...appointments };
            let newLastIndex = lastUsedAnimalIndex;

            if (status === 'empty') {
                delete newAppointments[selectedCellId];
            } else {
                let currentData = newAppointments[selectedCellId];
                let animalIndex = currentData?.animalIndex;

                if (status === 'booked' && animalIndex === undefined) {
                    newLastIndex++;
                    animalIndex = newLastIndex % animals.length;
                }
                
                newAppointments[selectedCellId] = {
                    status,
                    note: note,
                    animalIndex: animalIndex
                };
            }

            try {
                const appRef = getMainDocRef();
                await setDoc(appRef, {
                    data: newAppointments,
                    lastIndex: newLastIndex,
                    lastUpdated: new Date().toISOString()
                });
                closeModal();
            } catch (err) {
                console.error("Save Error:", err);
                alert("儲存失敗，請確認您的連線狀態。");
            }
        }

        // 啟動系統
        startSystem();

    </script>
</body>
</html>
